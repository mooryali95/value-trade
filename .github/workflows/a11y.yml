name: Accessibility gate

# Heavy browser suites run on pull requests (and on demand), not on every
# push to main: main only receives merged, already-tested pull requests and
# frequent Lovable edits, which would otherwise spend Actions minutes.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint accessibility rules (blocking)
        run: bun run lint:a11y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # No env overrides here: Vite reads the public Supabase URL and
      # publishable key committed in .env (as the CI build job does). Setting
      # them from repository secrets that are not configured would override
      # .env with empty values and every page would render the error screen.
      - name: Start dev server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:8080/ || (cat /tmp/dev.log && exit 1)

      - name: axe-core audit (blocking)
        env:
          A11Y_BASE_URL: http://localhost:8080
        run: python3 tests/a11y/axe_check.py

      - name: Keyboard navigation suite (blocking)
        env:
          A11Y_BASE_URL: http://localhost:8080
        run: python3 tests/a11y/keyboard_nav.py

      - name: aria-live announcements suite (blocking)
        env:
          A11Y_BASE_URL: http://localhost:8080
        run: python3 tests/a11y/live_regions.py

      - name: High-contrast + reduced-motion suite (blocking)
        env:
          A11Y_BASE_URL: http://localhost:8080
        run: python3 tests/a11y/theme_motion.py

      - name: Dev server log (on failure)
        if: failure()
        run: tail -n 200 /tmp/dev.log || true

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: tests/a11y/reports
          if-no-files-found: ignore